name: Nest reminders

# Sends web-push reminders on a schedule. The native Android app uses its own
# on-device alarms and doesn't rely on this, but the iPhone Home-Screen (PWA)
# does — iOS delivers web push to installed web apps, so this is what makes the
# iPhone's reminders fire. GitHub's scheduler is jittery (it can run every 1-2h
# under load), so for on-time alerts also run cron-job.org against the same
# endpoints every 5 min; the 30-min look-back and the dedupe table make running
# both safe.
#
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   NEST_FUNCTIONS_URL  e.g. https://YOUR-REF.supabase.co/functions/v1
#   NEST_CRON_KEY       the same value as the function's CRON_SECRET

on:
  schedule:
    - cron: '*/5 * * * *' # per-event / per-to-do reminders
    - cron: '0 21 * * *' # morning digest (21:00 UTC = 7am Sydney)
  workflow_dispatch: {} # run on demand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Due reminders (per-event / per-to-do)
        if: github.event.schedule != '0 21 * * *'
        run: |
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
            -H "x-cron-key: ${NEST_CRON_KEY}" \
            "${NEST_FUNCTIONS_URL}/send-due-reminders")
          echo "send-due-reminders -> HTTP $code"; cat /tmp/out; echo
          test "$code" = "200"
        env:
          NEST_FUNCTIONS_URL: ${{ secrets.NEST_FUNCTIONS_URL }}
          NEST_CRON_KEY: ${{ secrets.NEST_CRON_KEY }}

      - name: Morning digest
        if: github.event.schedule == '0 21 * * *'
        run: |
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
            -H "x-cron-key: ${NEST_CRON_KEY}" \
            "${NEST_FUNCTIONS_URL}/send-reminders")
          echo "send-reminders -> HTTP $code"; cat /tmp/out; echo
          test "$code" = "200"
        env:
          NEST_FUNCTIONS_URL: ${{ secrets.NEST_FUNCTIONS_URL }}
          NEST_CRON_KEY: ${{ secrets.NEST_CRON_KEY }}
